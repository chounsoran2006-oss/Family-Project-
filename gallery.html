<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Explore the My Family gallery with photographs of family life, celebrations, travel, and special moments in Cambodia." />
  <meta name="keywords" content="My Family gallery, family photos, memories, Cambodia" />
  <meta name="author" content="My Family" />
  <title>Gallery | My Family</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwUEQp1BV6G5v8X/4bY0mY7ZM9K3gLwQ9M4F8A==" crossorigin="anonymous"
    referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/png" href="./photo/happenis.png">
</head>

<body data-page="gallery">
  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="brand">
        <span class="brand-mark">M</span>
        <span>My Family</span>
      </a>

      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="nav-menu" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="family.html">Family</a>
        <a href="gallery.html" class="active">Gallery</a>
        <a href="memories.html">Memories</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-banner">
      <div class="container">
        <span class="eyebrow accent">Family gallery</span>
        <h1>Our Family Gallery</h1>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="gallery-toolbar reveal">
          <button class="gallery-filter active" data-filter="all" type="button">All</button>
          <button class="gallery-filter" data-filter="family" type="button">Family</button>
          <button class="gallery-filter" data-filter="parents" type="button">Parents</button>
          <button class="gallery-filter" data-filter="brothers" type="button">Brothers</button>
          <button class="gallery-filter" data-filter="celebration" type="button">Celebrations</button>
          <button class="gallery-filter" data-filter="travel" type="button">Travel</button>
        </div>

        <div class="gallery-grid">
          <figure class="gallery-item reveal" data-category="family">
            <img src="./photo/groupfamily.png" alt="Family portrait placeholder" />
            <figcaption>Family</figcaption>
          </figure>
          <figure class="gallery-item reveal" data-category="parents">
            <img src="./photo/group.png" alt="Parents placeholder" />
            <figcaption>Parents</figcaption>
          </figure>
          <figure class="gallery-item reveal" data-category="brothers">
            <img src="./photo/brother.png" alt="Brothers placeholder" />
            <figcaption>Brothers</figcaption>
          </figure>
          <figure class="gallery-item reveal" data-category="celebration">
            <img src="./photo/HBD.png" alt="Celebration placeholder" />
            <figcaption>Celebrations</figcaption>
          </figure>
          <figure class="gallery-item reveal" data-category="travel">
            <img src="./photo/travel.png" alt="Travel placeholder" />
            <figcaption>Travel</figcaption>
          </figure>
          <figure class="gallery-item reveal" data-category="family">
            <img src="./photo/funny.png" alt="Family activity placeholder" />
            <figcaption>Daily Life</figcaption>
          </figure>
          <figure class="gallery-item reveal" data-category="celebration">
            <img src="./photo/happenis.png" alt="Holiday memory placeholder" />
            <figcaption>Special Moments</figcaption>
          </figure>
          <figure class="gallery-item reveal" data-category="travel">
            <img src="./photo/myfamily.png" alt="Beautiful place placeholder" />
            <figcaption>Beautiful Places</figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <div class="lightbox" aria-label="Image preview" aria-hidden="true">
    <button class="lightbox-close" type="button" aria-label="Close gallery image">&times;</button>
    <img src="" alt="Expanded gallery item" />
  </div>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <h3>My Family</h3>
        <p>“Together We Make a Family”</p>
      </div>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="family.html">Family</a>
        <a href="gallery.html">Gallery</a>
        <a href="memories.html">Memories</a>
        <a href="contact.html">Contact</a>
      </div>
      <div class="socials">
        <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
      </div>
    </div>
    <div class="footer-bottom">© 2026 My Family. All Rights Reserved.</div>
  </footer>

  <button class="back-to-top" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>
  <script src="js/script.js"></script>
</body>

</html>
